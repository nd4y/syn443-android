name: CI captured VM diagnostic
on:
  push:
    branches: ['feature/ci-captured-vm-reboot-20261116']
    paths:
      - 'ci-vm-probe/**'
      - 'tools/emulator_vm_probe.py'
      - 'tools/test_emulator_vm_probe.py'
      - 'tools/prepare_emulator_art.py'
      - 'tools/check_emulator_heap.py'
      - 'tools/emulator_boot.py'
      - 'settings.gradle.kts'
      - '.github/workflows/avd-vm-capture.yml'
  pull_request:
    paths:
      - 'ci-vm-probe/**'
      - 'tools/emulator_vm_probe.py'
      - 'tools/test_emulator_vm_probe.py'
      - 'tools/prepare_emulator_art.py'
      - 'tools/check_emulator_heap.py'
      - 'tools/emulator_boot.py'
      - 'settings.gradle.kts'
      - '.github/workflows/avd-vm-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: captured-vm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  SYN443_CI_AVD: syn443-ci
  SYN443_VM_PROBE_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
  SYN443_CI_EMULATOR_OPTIONS: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -no-metrics -feature -Vulkan
jobs:
  capture-api29:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - run: bash tools/prepare_android_tools.sh
      - name: Verify diagnostic parser and identity guards
        run: python3 -m unittest discover -s tools -p 'test_emulator_vm_probe.py'
      - name: Build only the independent probe and its pure unit tests
        run: |
          ./gradlew :ci-vm-probe:assembleDebug :ci-vm-probe:testDebugUnitTest :ci-vm-probe:lintDebug --dry-run --console=plain > "$RUNNER_TEMP/probe-task-graph.txt"
          python3 - "$RUNNER_TEMP/probe-task-graph.txt" <<'PY'
          from pathlib import Path
          import re, sys
          tasks = re.findall(r'^(:[A-Za-z0-9:_-]+) SKIPPED$', Path(sys.argv[1]).read_text(), re.M)
          assert {':ci-vm-probe:assembleDebug', ':ci-vm-probe:testDebugUnitTest', ':ci-vm-probe:lintDebug'} <= set(tasks)
          assert all(task.startswith(':ci-vm-probe:') for task in tasks), 'Production/native task edge refused'
          print('Probe-only Gradle task graph verified')
          PY
          ./gradlew :ci-vm-probe:assembleDebug :ci-vm-probe:testDebugUnitTest :ci-vm-probe:lintDebug --stacktrace --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8'
          ./gradlew --stop
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('ci-vm-probe/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          assert files, 'Probe JVM evidence missing'
          cases = [case for path in files for case in ET.parse(path).iter('testcase')]
          expected = {('io.syn443.emulatorheap.VmMemorySnapshotTest', name) for name in (
              'capturedTinyAndRepresentativeVmsRemainExactNumericEvidence',
              'invalidCapacityAllocationProcessAndClockNeverBecomeSnapshots')}
          assert len(cases) == len(expected) and {(c.get('classname'), c.get('name')) for c in cases} == expected
          assert all(not any(c.find(tag) is not None for tag in ('failure', 'error', 'skipped')) for c in cases)
          print('Two actual independent-probe JVM outcomes passed without skips')
          PY
          python3 tools/check_public_data.py ci-vm-probe/build/outputs/apk/debug/ci-vm-probe-debug.apk
          bash tools/scan_secrets.sh ci-vm-probe/build/outputs/apk/debug/ci-vm-probe-debug.apk
      - name: Enable KVM for this disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: adb version && adb start-server
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          avd-name: syn443-ci
          pre-emulator-launch-script: grep -Fx 'target=android-29' "$HOME/.android/avd/syn443-ci.ini"
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          cores: 2
          disk-size: 8G
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: ${{ env.SYN443_CI_EMULATOR_OPTIONS }}
          script: python3 tools/emulator_vm_probe.py --source "$SYN443_VM_PROBE_SOURCE"
      - name: Validate and scan bounded metadata only
        id: metadata-scan
        if: always() && hashFiles('public-evidence/avd-vm-capture.json') != ''
        run: |
          python3 tools/emulator_vm_probe.py --check
          python3 tools/check_public_data.py public-evidence/avd-vm-capture.json
          bash tools/scan_secrets.sh public-evidence/avd-vm-capture.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.metadata-scan.outcome == 'success'
        with:
          name: avd-captured-vm-api29
          path: public-evidence/avd-vm-capture.json
          if-no-files-found: error
          retention-days: 14
