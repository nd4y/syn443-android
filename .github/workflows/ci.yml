name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '47 2 * * *'
permissions:
  contents: read
env:
  SYN443_ENROLLMENT_LINK_HOST: ${{ github.event_name == 'workflow_dispatch' && vars.SYN443_PUBLIC_ENROLLMENT_LINK_HOST || '' }}
  SYN443_INSTALLATION_PROFILE: ${{ github.event_name == 'workflow_dispatch' && secrets.SYN443_PUBLIC_INSTALLATION_PROFILE || '' }}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  public-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m unittest discover -s tools -p 'test_public_data.py'
      - run: python3 -m unittest discover -s tools -p 'test_installation_profile.py'
      - run: python3 tools/check_installation_profile.py
      - run: python3 tools/check_public_data.py --history
      - run: bash tools/scan_secrets.sh
      - name: Verify scanner cache integrity and offline reuse
        run: bash tools/test_scanner_cache.sh
  documents:
    needs: public-data
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 tools/check_documents.py
      - run: python3 tools/check_contracts.py
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: bash -n tools/run_emulator_tests.sh tools/prepare_android_tools.sh
      - run: python3 -m unittest discover -s tools -p test_emulator_policy_ui.py
      - run: python3 -m unittest discover -s tools -p test_emulator_heap.py
  native:
    needs: public-data
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.11'
          cache-dependency-path: native/bridge/go.sum
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools ndk;27.3.13750724'
      - run: SYN443_RACE=1 GOMEMLIMIT=3GiB ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724" bash native/build_engine.sh
      - run: python3 tools/check_native.py native/build/engine.aar
      - run: python3 tools/check_public_data.py native/build/engine.aar
      - run: bash tools/scan_secrets.sh native/build/engine.aar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: embedded-native-engine
          path: native/build/engine.aar
          if-no-files-found: error
          retention-days: 7
  jvm-and-apk:
    needs: [public-data, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: embedded-native-engine
          path: native/build
      - uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-37.1 build-tools;36.0.0'
      - name: Install synthetic media fixture generator
        run: |
          bash -n tools/prepare_media_tools.sh
          bash tools/prepare_media_tools.sh
      - run: python3 tools/generate_chat_media_fixture.py
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.4'
          cache: false
      - run: bash tools/prepare-operation-wire-conformance.sh ./gradlew :core:decision:test :core:decision:jacocoTestReport :core:host-lifecycle:check :core:host-lifecycle:jacocoTestReport :core:recovery:test :core:policy:test :core:observability:check :core:health:check :core:identity:check :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - run: python3 tools/check_test_evidence.py jvm
      - run: python3 tools/check_test_evidence.py host
      - run: python3 tools/check_test_evidence.py recovery
      - run: python3 tools/check_test_evidence.py policy
      - run: python3 tools/check_test_evidence.py observability
      - run: python3 tools/check_test_evidence.py health
      - run: python3 tools/check_test_evidence.py identity
      - run: python3 tools/check_apk.py app/build/outputs/apk/debug/app-debug.apk
      - run: '"$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk'
      - name: Dependency inventory
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath > dependency-inventory.txt
          ./gradlew :app:dependencies --configuration debugAndroidTestRuntimeClasspath >> dependency-inventory.txt
      - name: Scan JVM report payloads
        id: reports-scan
        if: always()
        run: |
          paths=()
          for path in core/decision/build/reports core/decision/build/test-results core/host-lifecycle/build/reports core/host-lifecycle/build/test-results core/recovery/build/reports core/recovery/build/test-results core/policy/build/reports core/policy/build/test-results core/observability/build/reports core/observability/build/test-results core/health/build/reports core/health/build/test-results core/identity/build/reports core/identity/build/test-results app/build/reports dependency-inventory.txt; do
            if [ -e "$path" ]; then paths+=("$path"); fi
          done
          test "${#paths[@]}" -gt 0
          python3 tools/check_public_data.py "${paths[@]}"
          bash tools/scan_secrets.sh "${paths[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: reports-upload
        if: always() && steps.reports-scan.outcome == 'success'
        with:
          name: android-jvm-lint-evidence
          path: |
            core/decision/build/reports/
            core/decision/build/test-results/
            core/host-lifecycle/build/reports/
            core/host-lifecycle/build/test-results/
            core/recovery/build/reports/
            core/recovery/build/test-results/
            core/policy/build/reports/
            core/policy/build/test-results/
            core/observability/build/reports/
            core/observability/build/test-results/
            core/health/build/reports/
            core/health/build/test-results/
            core/identity/build/reports/
            core/identity/build/test-results/
            app/build/reports/
            dependency-inventory.txt
          retention-days: 14
      - run: test -s app/build/outputs/apk/debug/app-debug.apk && test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Verify standalone competing VPN test package
        run: |
          manifest="$RUNNER_TEMP/syn443-test-manifest.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk --file AndroidManifest.xml > "$manifest"
          grep -Fq '"io.syn443.android.acceptance.CompetingVpnService"' "$manifest"
          if grep -Fq '"androidx.startup.InitializationProvider"' "$manifest"; then
            echo "The standalone VPN fixture cannot load the target application's startup provider."
            exit 1
          fi
      - name: Scan APK payloads
        run: |
          python3 tools/check_apk_assets.py
          python3 tools/check_public_data.py app/build/outputs/apk/
          bash tools/scan_secrets.sh app/build/outputs/apk/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: apk-upload
        with:
          name: syn443-prototype-debug-apks
          path: app/build/outputs/apk/
          if-no-files-found: error
          retention-days: 14
      - name: Record and scan the exact build manifest
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 tools/build_manifest.py "$SOURCE_COMMIT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" public-evidence/build-manifest.json
          python3 tools/check_public_data.py public-evidence/build-manifest.json
          bash tools/scan_secrets.sh public-evidence/build-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: syn443-build-manifest
          path: public-evidence/build-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Assemble and inspect the unsigned release for independent signing
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --stacktrace
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          stage="$RUNNER_TEMP/syn443-release-input"
          mkdir "$stage"
          python3 tools/check_apk.py "$apk"
          python3 tools/check_apk_assets.py "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"; then
            echo "Expected an unsigned release input" >&2
            exit 1
          fi
          apkanalyzer manifest print "$apk" > "$RUNNER_TEMP/release-manifest.xml"
          python3 tools/release_input.py "$RUNNER_TEMP/release-manifest.xml" "$SOURCE_COMMIT" "$stage/inventory.json"
          cp "$apk" "$stage/"
          python3 tools/check_public_data.py "$stage"
          bash tools/scan_secrets.sh "$stage"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: syn443-unsigned-release-input
          path: ${{ runner.temp }}/syn443-release-input/
          if-no-files-found: error
          retention-days: 14
      - name: Check out the approved Control Plane release tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nd4y/syn443-control-plane
          ref: 655e923ffc0eb9a91f6fb90941ab48d11728a77d
          path: .release-verification
          persist-credentials: false
      - name: Build offline delivery verifier
        working-directory: .release-verification
        run: GOTOOLCHAIN=local GOWORK=off go build -mod=readonly -trimpath -o "$RUNNER_TEMP/apk-release" ./cmd/apk-release
      - name: Verify a signed release with a disposable fixture certificate
        run: |
          python3 tools/exercise_signed_apk.py \
            "$RUNNER_TEMP/syn443-release-input/app-release-unsigned.apk" \
            "$RUNNER_TEMP/syn443-release-input/inventory.json" \
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" "$RUNNER_TEMP/signing-acceptance.json" \
            --release-tool "$RUNNER_TEMP/apk-release"
          python3 tools/check_public_data.py "$RUNNER_TEMP/signing-acceptance.json"
          bash tools/scan_secrets.sh "$RUNNER_TEMP/signing-acceptance.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: syn443-signing-test-evidence
          path: ${{ runner.temp }}/signing-acceptance.json
          if-no-files-found: error
          retention-days: 14
      - name: Assemble the higher-version debug upgrade fixture
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/upgrade-fixture"
          mkdir "$fixture"
          base="$RUNNER_TEMP/base-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$base"
          ./gradlew -Psyn443CiUpgrade=true :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$fixture/new-debug.apk"
          python3 tools/verify_upgrade_fixture.py record "$base" "$fixture/new-debug.apk" public-evidence/build-manifest.json "$fixture/upgrade.json"
          python3 tools/check_apk.py "$fixture/new-debug.apk"
          python3 tools/check_apk_assets.py "$fixture/new-debug.apk"
          python3 tools/check_public_data.py "$fixture"
          bash tools/scan_secrets.sh "$fixture"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: syn443-version-upgrade-fixture
          path: ${{ runner.temp }}/upgrade-fixture/
          if-no-files-found: error
          retention-days: 7
  workflow-lint:
    needs: public-data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.4'
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
  emulator:
    needs: jvm-and-apk
    runs-on: ubuntu-24.04
    # Cold API37 image/tool preparation consumed 20+ minutes on a measured run.
    # Runtime activation/probe/restart deadlines remain unchanged.
    # Includes the unshortened first 15-minute WorkManager interval.
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35, '37.0']
        include:
          - api: 29
            profile: pixel_2
            ram: 2048M
            heap: 256M
            cores: 2
            disk: 8G
          - api: '37.0'
            profile: pixel_2
            ram: 4096M
            cores: 4
            disk: 8G
            options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -no-metrics -show-kernel
    env:
      SYN443_CI_AVD: syn443-ci
      SYN443_CI_EMULATOR_OPTIONS: ${{ matrix.options || '-no-window -gpu software -no-snapshot -noaudio -no-boot-anim -no-metrics -feature -Vulkan -show-kernel' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reserve emulator disk on this disposable runner
        run: |
          df -h "$HOME"
          sudo rm -rf -- /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h "$HOME"
          available_mb=$(df -Pm "$HOME" | awk 'NR==2 {print $4}')
          test "$available_mb" -ge 16384
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: syn443-prototype-debug-apks
          path: app/build/outputs/apk
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: syn443-build-manifest
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: syn443-version-upgrade-fixture
          path: ${{ runner.temp }}/upgrade-fixture
      - run: python3 tools/run_packaged_instrumentation.py verify
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-37.1 build-tools;36.0.0'
      - run: bash tools/prepare_android_tools.sh
      - name: Verify exact upgrade inputs before using the emulator
        run: python3 tools/verify_upgrade_fixture.py verify app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/upgrade-fixture/new-debug.apk" "$RUNNER_TEMP/build-manifest.json" "$RUNNER_TEMP/upgrade-fixture/upgrade.json"
      - name: Start ADB before emulator
        run: adb version && adb start-server
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          avd-name: syn443-ci
          pre-emulator-launch-script: grep -Fx 'target=android-${{ matrix.api }}' "$HOME/.android/avd/syn443-ci.ini"
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          profile: ${{ matrix.profile || '' }}
          ram-size: ${{ matrix.ram || '' }}
          heap-size: ${{ matrix.heap || '256M' }}
          cores: ${{ matrix.cores || 2 }}
          disk-size: ${{ matrix.disk || '8G' }}
          emulator-boot-timeout: 900
          emulator-options: ${{ env.SYN443_CI_EMULATOR_OPTIONS }}
          script: bash tools/run_emulator_tests.sh
      - name: Publish sanitized recovery timings
        id: recovery-scan
        if: always()
        run: |
          python3 tools/recovery_slo.py
          python3 tools/check_public_data.py public-evidence/recovery
          bash tools/scan_secrets.sh public-evidence/recovery
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.recovery-scan.outcome == 'success'
        with:
          name: android-recovery-${{ matrix.api }}-evidence
          path: public-evidence/recovery/recovery-slo.json
          if-no-files-found: error
          retention-days: 14
      - name: Check both planned proxy recovery samples on a successful emulator
        run: python3 tools/recovery_slo.py --require-success
      - name: Scan emulator report payloads
        id: emulator-scan
        if: always()
        run: |
          python3 tools/collect_public_emulator.py
          python3 tools/check_public_data.py public-evidence/emulator
          bash tools/scan_secrets.sh public-evidence/emulator
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: emulator-evidence-upload
        if: always() && steps.emulator-scan.outcome == 'success'
        with:
          name: android-emulator-${{ matrix.api }}-evidence
          path: public-evidence/emulator/
          retention-days: 14
