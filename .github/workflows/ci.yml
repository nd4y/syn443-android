name: Android17BootstrapDiagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android17:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Disk and KVM preparation on this disposable runner
        run: |
          sudo rm -rf -- /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h "$HOME"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - run: bash tools/prepare_android_tools.sh
      - run: adb version && adb start-server
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          avd-name: syn443-ci
          pre-emulator-launch-script: grep -Fx 'target=android-37.0' "$HOME/.android/avd/syn443-ci.ini"
          api-level: '37.0'
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 4096M
          cores: 4
          disk-size: 8G
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -no-metrics -show-kernel
          script: bash tools/android17_bootstrap_diagnostic.sh
