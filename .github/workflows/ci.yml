name: CI
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    # Cold API37 image/tool preparation consumed 20+ minutes on a measured run.
    # Runtime activation/probe/restart deadlines remain unchanged.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [29]
    env:
      SYN443_CI_AVD: syn443-ci
      SYN443_CI_EMULATOR_OPTIONS: ${{ matrix.options || '-no-window -gpu software -no-snapshot -noaudio -no-boot-anim -no-metrics -feature -Vulkan -show-kernel' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reserve emulator disk on this disposable runner
        run: |
          df -h "$HOME"
          sudo rm -rf -- /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h "$HOME"
          available_mb=$(df -Pm "$HOME" | awk 'NR==2 {print $4}')
          test "$available_mb" -ge 16384
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 44932680946
          name: syn443-prototype-debug-apks
          path: app/build/outputs/apk
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 44932680946
          name: syn443-build-manifest
          path: ${{ runner.temp }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-37.1 build-tools;36.0.0'
      - run: bash tools/prepare_android_tools.sh
      - name: Start ADB before emulator
        run: adb version && adb start-server
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          avd-name: syn443-ci
          pre-emulator-launch-script: grep -Fx 'target=android-${{ matrix.api }}' "$HOME/.android/avd/syn443-ci.ini"
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          profile: ${{ matrix.profile || '' }}
          ram-size: ${{ matrix.ram || '' }}
          heap-size: ${{ matrix.heap || '256M' }}
          cores: ${{ matrix.cores || 2 }}
          disk-size: ${{ matrix.disk || '8G' }}
          emulator-boot-timeout: 900
          emulator-options: ${{ env.SYN443_CI_EMULATOR_OPTIONS }}
          script: python3 tools/replay_editor_assertion.py
