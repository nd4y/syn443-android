name: Android17BootstrapDiagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android17:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Disk and KVM preparation on this disposable runner
        run: |
          sudo rm -rf -- /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h "$HOME"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - run: adb version && adb start-server
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: '37.0'
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 3072M
          cores: 4
          disk-size: 8G
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -feature -Vulkan -show-kernel
          script: |
            adb shell getprop ro.build.version.sdk
            adb shell df -h /data
            for attempt in 1 2 3 4 5 6; do
              echo "health iteration $attempt"
              adb shell pidof system_server || true
              adb shell service check package || true
              adb shell service check settings || true
              sleep 10
            done
            adb logcat -b crash -d
            adb logcat -d -s AndroidRuntime SystemServer Watchdog PackageManager
            adb shell service list

