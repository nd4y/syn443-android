name: Offline bundle cold boot
on:
  push:
    branches: [qa/bundle-provider-cold-boot]
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 59435db187d782766ef99e5b7dc8ceef65bb42dd
          path: candidate-release
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 44853772786
          name: syn443-prototype-debug-apks
          path: ${{ runner.temp }}/bundle-apks
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 44853772786
          name: syn443-build-manifest
          path: ${{ runner.temp }}/bundle-manifest
          github-token: ${{ github.token }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Verify build and enable KVM
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/bundle-manifest/build-manifest.json"
          test "$(jq -r .sourceCommit "$manifest")" = 59435db187d782766ef99e5b7dc8ceef65bb42dd
          test "$(jq -r .actionsRun "$manifest")" = 44853772786
          test "$(sha256sum "$RUNNER_TEMP/bundle-apks/debug/app-debug.apk" | cut -d' ' -f1)" = "$(jq -r '.artifacts["app/build/outputs/apk/debug/app-debug.apk"].sha256' "$manifest")"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          adb start-server
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          cores: 2
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -no-metrics -feature -Vulkan
          script: python3 tools/diagnose_cold_bundle.py
